<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NationStates Endorsements</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

.nation {
    margin-bottom: 8px;
}

.nation a {
    margin-right: 8px;
}

button {
    cursor: pointer;
}

#add-section {
    margin-bottom: 20px;
}

#nation-input {
    width: 350px;
    max-width: 90%;
}
</style>
</head>

<body>

<div id="add-section">
    <input
        id="nation-input"
        type="text"
        placeholder="Nation name or URL"
    >
    <button onclick="addNation()">Add Nation</button>
</div>

<div id="nations">

</div>

<script>

const STORAGE_KEY = "ns_endorsement_changes";

function getChanges() {
    try {
        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || { removed: [], added: [] };
    } catch {
        return { removed: [], added: [] };
    }
}

function saveChanges(changes) {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(changes)
    );
}

function normalizeNation(value) {
    value = value.trim();

    if (!value) {
        return "";
    }

    if (value.includes("nation=")) {
        value = value.split("nation=")[1];
    }

    value = value.split("&")[0];
    value = value.split("#")[0];

    return value
        .toLowerCase()
        .replace(/ /g, "_");
}

function nationURL(slug) {
    return (
        "https://www.nationstates.net/nation="
        + encodeURIComponent(slug)
    );
}

function markClicked(slug) {
    const changes = getChanges();

    if (!changes.removed.includes(slug)) {
        changes.removed.push(slug);
    }

    changes.added = changes.added.filter(
        nation => nation !== slug
    );

    saveChanges(changes);

    setTimeout(() => {
        const element = document.querySelector(
            '[data-slug="' + CSS.escape(slug) + '"]'
        );

        if (element) {
            element.remove();
        }
    }, 100);
}

function removeNation(slug) {
    const changes = getChanges();

    if (!changes.removed.includes(slug)) {
        changes.removed.push(slug);
    }

    changes.added = changes.added.filter(
        nation => nation !== slug
    );

    saveChanges(changes);

    const element = document.querySelector(
        '[data-slug="' + CSS.escape(slug) + '"]'
    );

    if (element) {
        element.remove();
    }
}

function addNation() {
    const input = document.getElementById(
        "nation-input"
    );

    const slug = normalizeNation(
        input.value
    );

    if (!slug) {
        return;
    }

    const changes = getChanges();

    changes.removed = changes.removed.filter(
        nation => nation !== slug
    );

    if (!changes.added.includes(slug)) {
        changes.added.push(slug);
    }

    saveChanges(changes);

    addNationToPage(slug);

    input.value = "";
}

function addNationToPage(slug) {
    const existing = document.querySelector(
        '[data-slug="' + CSS.escape(slug) + '"]'
    );

    if (existing) {
        return;
    }

    const container = document.getElementById(
        "nations"
    );

    const div = document.createElement("div");

    div.className = "nation";
    div.dataset.slug = slug;

    const link = document.createElement("a");

    link.href = nationURL(slug);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = nationURL(slug);

    link.onclick = function() {
        markClicked(slug);
    };

    const button = document.createElement("button");

    button.textContent = "Delete";

    button.onclick = function() {
        removeNation(slug);
    };

    div.appendChild(link);
    div.appendChild(button);

    container.appendChild(div);
}

function applySavedChanges() {
    const changes = getChanges();

    for (const slug of changes.removed) {
        const element = document.querySelector(
            '[data-slug="' + CSS.escape(slug) + '"]'
        );

        if (element) {
            element.remove();
        }
    }

    for (const slug of changes.added) {
        addNationToPage(slug);
    }
}

applySavedChanges();

</script>

</body>
</html>
