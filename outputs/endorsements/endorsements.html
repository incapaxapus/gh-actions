<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Unendorsed WA Nations</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
}

.nation {
    margin: 8px 0;
}

.nation a {
    margin-right: 10px;
}

button {
    cursor: pointer;
}
</style>

<script>
function removeNation(link) {
    setTimeout(function() {
        link.parentElement.remove();
    }, 100);
}

function deleteNation(button) {
    button.parentElement.remove();
}

function addNation() {
    const input = document.getElementById("nationInput");
    const name = input.value.trim();

    if (!name) return;

    const div = document.createElement("div");
    div.className = "nation";

    const link = document.createElement("a");

    link.href =
        "https://www.nationstates.net/nation=" +
        name.toLowerCase().replace(/ /g, "_");

    link.target = "_blank";
    link.textContent = name;

    link.onclick = function() {
        setTimeout(function() {
            div.remove();
        }, 100);
    };

    const button = document.createElement("button");
    button.textContent = "Delete";

    button.onclick = function() {
        div.remove();
    };

    div.appendChild(link);
    div.appendChild(button);

    document.getElementById("nations").appendChild(div);

    input.value = "";
}
</script>

</head>

<body>

<h1>Unendorsed WA Nations</h1>

<div>
    <input
        id="nationInput"
        placeholder="Nation name"
    >

    <button onclick="addNation()">
        Add Nation
    </button>
</div>

<br>

<div id="nations">

</div>

</body>
</html>
