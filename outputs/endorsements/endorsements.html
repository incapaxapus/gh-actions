<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NationStates Endorsements</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

.nation {
    margin-bottom: 8px;
}

.nation a {
    margin-right: 8px;
}

button {
    cursor: pointer;
}

#add-section {
    margin-bottom: 20px;
}

#nation-input {
    width: 350px;
    max-width: 90%;
}
</style>
</head>

<body>

<div id="add-section">
    <input
        id="nation-input"
        type="text"
        placeholder="Nation name or URL"
    >
    <button onclick="addNation()">Add Nation</button>
</div>

<div id="nations">

</div>

<script>

function normalizeNation(value) {
    value = value.trim();

    if (!value) {
        return "";
    }

    if (value.includes("nation=")) {
        value = value.split("nation=")[1];
    }

    value = value.split("&")[0];
    value = value.split("#")[0];

    return value
        .toLowerCase()
        .replace(/ /g, "_");
}

function nationURL(slug) {
    return (
        "https://www.nationstates.net/nation="
        + encodeURIComponent(slug)
    );
}

function markClicked(slug) {
    const element = document.querySelector(
        '[data-slug="' + CSS.escape(slug) + '"]'
    );

    if (element) {
        element.remove();
    }
}

function removeNation(slug) {
    const element = document.querySelector(
        '[data-slug="' + CSS.escape(slug) + '"]'
    );

    if (element) {
        element.remove();
    }
}

function addNation() {
    const input = document.getElementById(
        "nation-input"
    );

    const slug = normalizeNation(
        input.value
    );

    if (!slug) {
        return;
    }

    const existing = document.querySelector(
        '[data-slug="' + CSS.escape(slug) + '"]'
    );

    if (existing) {
        input.value = "";
        return;
    }

    const container = document.getElementById(
        "nations"
    );

    const div = document.createElement("div");

    div.className = "nation";
    div.dataset.slug = slug;

    const link = document.createElement("a");

    link.href = nationURL(slug);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    link.textContent = nationURL(slug);

    link.onclick = function() {
        markClicked(slug);
    };

    const button = document.createElement("button");

    button.textContent = "Delete";

    button.onclick = function() {
        removeNation(slug);
    };

    div.appendChild(link);
    div.appendChild(button);

    container.appendChild(div);

    input.value = "";
}

</script>

</body>
</html>
