name: ns_country_ping

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        env:
          NS_NATION_NAME: ${{ secrets.NS_NATION_NAME }}
          NS_CONTACT_INFO: ${{ secrets.NS_CONTACT_INFO }}
        run: python ns_actions/ns_country_ping.py
